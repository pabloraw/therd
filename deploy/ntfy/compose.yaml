# Servidor ntfy para las notificaciones de therd.
#
# Escucha solo en la IP de Tailscale (para el móvil) y en loopback (para el
# daemon), nunca en todas las interfaces. Arranque:
#
#   TS_IP=$(tailscale ip -4) docker compose -f deploy/ntfy/compose.yaml up -d
#
# Docker guarda la IP resuelta: si cambia la de Tailscale, se repite el comando.
name: therd-ntfy

services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: http://${TS_IP:?falta TS_IP}:24602
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 12h
      NTFY_BEHIND_PROXY: "false"
    ports:
      - "${TS_IP}:24602:80"
      - "127.0.0.1:24602:80"
    volumes:
      - cache:/var/cache/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -q '\"healthy\":true'"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  cache:
