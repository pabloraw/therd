name: therd
description: "Vista de chat móvil para Claude Code dentro de herdr."
publish_to: 'none'

version: 0.4.0+4

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  web_socket_channel: ^3.0.3
  gpt_markdown: ^1.3.4
  mobile_scanner: ^7.5.0
  shared_preferences: ^2.5.5
  therd_protocol:
    path: ../packages/protocol
  speech_to_text: ^7.4.0
  app_links: ^7.0.0
  unifiedpush: ^6.2.0
  flutter_local_notifications: ^22.3.3
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Geist y Geist Mono (OFL, ver assets/fonts/OFL-Geist.txt).
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600

dependency_overrides:
  # 3.5.0 necesita el Android Gradle Plugin 9 (Kotlin integrado); el proyecto
  # está en AGP 8. Quitar al subir de AGP.
  unifiedpush_android: 3.4.1
